<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>图书馆勤工助学值班记录器</title>
		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- Font Awesome CDN -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
		<!-- Custom CSS -->
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body class="min-h-screen py-6 px-4 md:py-10 md:px-8">
		<div class="max-w-5xl mx-auto card p-6 md:p-8">
			<h1 class="text-2xl md:text-3xl font-bold text-center mb-8" style="color: var(--text-primary);">
				<i class="fa-solid fa-book mr-2" style="color: var(--primary);"></i>图书馆勤工助学值班记录器
			</h1>

			<!-- 模式切换按钮组 -->
			<div class="shift-mode-group flex flex-wrap gap-2 mb-8">
				<button id="mode-both" class="mode-btn btn-custom px-4 py-2 rounded-lg active">
					<i class="fa-solid fa-layer-group mr-1"></i>双班模式
				</button>
				<button id="mode-only-library" class="mode-btn btn-custom px-4 py-2 rounded-lg">
					<i class="fa-solid fa-book-open mr-1"></i>仅书库模式
				</button>
				<button id="mode-only-circulation" class="mode-btn btn-custom px-4 py-2 rounded-lg">
					<i class="fa-solid fa-arrows-rotate mr-1"></i>仅流通模式
				</button>
			</div>

			<!-- 学生添加区 -->
			<div class="card p-5 mb-8">
				<h3 class="font-semibold mb-4" style="color: var(--text-primary);"><i class="fa-solid fa-user-plus mr-2" style="color: var(--primary);"></i>添加学生</h3>
				<div class="flex flex-col md:flex-row gap-3">
					<input type="text" id="student-name" placeholder="请输入学生姓名"
						class="flex-1 px-3 py-2 rounded-lg focus:outline-none" style="border: 1px solid var(--border); background-color: var(--bg-card); color: var(--text-primary);">
					<button id="add-student-btn" class="btn-custom btn-primary px-4 py-2 rounded-lg">
						<i class="fa-solid fa-plus"></i>添加
					</button>
					<button id="batch-import-btn" class="btn-custom btn-primary px-4 py-2 rounded-lg">
						<i class="fa-solid fa-file-import"></i>批量导入
					</button>
					<button id="reset-all-btn" class="btn-custom btn-danger reset-all-btn px-4 py-2 rounded-lg">
						<i class="fa-solid fa-trash-can"></i>全部重置
						<span class="tooltip">此操作不可恢复，清空所有数据</span>
					</button>
				</div>
			</div>

			<!-- 学生列表 -->
			<div class="mb-8">
				<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
					<h3 class="font-semibold text-lg" style="color: var(--text-primary);"><i
							class="fa-solid fa-list mr-2" style="color: var(--primary);"></i>学生值班记录</h3>
					<div class="flex gap-2">
						<button id="toggle-student-list-btn" class="btn-custom btn-outline px-3 py-2 rounded-lg">
							<i class="fa-solid fa-chevron-up mr-1"></i>折叠学生列表
						</button>
						<button id="toggle-summary-btn" class="btn-custom btn-outline px-3 py-2 rounded-lg">
							<i class="fa-solid fa-table mr-1"></i>显示汇总
						</button>
						<button id="show-history-btn" class="btn-custom btn-outline px-3 py-2 rounded-lg">
							<i class="fa-solid fa-history mr-1"></i>操作日志
						</button>
					</div>
				</div>
				<div id="student-list" class="student-list-container p-3 rounded-lg"></div>
			</div>

			<!-- 汇总表格 -->
			<div id="summary-container" class="summary-container mb-8">
				<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
					<h3 class="font-semibold text-lg" style="color: var(--text-primary);"><i
							class="fa-solid fa-table mr-2" style="color: var(--primary);"></i>值班汇总</h3>
					<div class="flex items-center gap-3">
						<span class="text-sm" style="color: var(--text-muted);">更新时间：<span id="table-update-time">--</span></span>
						<div class="flex gap-1 p-1 rounded-lg" style="background-color: var(--bg-secondary);">
							<button id="table-mode-full" class="table-mode-btn active" title="完整显示">
								<i class="fa-solid fa-expand-alt mr-1"></i>完整
							</button>
							<button id="table-mode-scroll" class="table-mode-btn" title="内部滚动">
								<i class="fa-solid fa-arrows-alt-v mr-1"></i>滚动
							</button>
						</div>
					</div>
				</div>
				<div id="summary-wrapper" class="overflow-hidden">
					<div id="summary-scroll-area" class="overflow-x-auto">
						<table id="summary-table" class="w-full border-collapse">
							<!-- 表格内容由 JS 动态生成 -->
						</table>
					</div>
				</div>
			</div>

			<!-- 底部统计卡片 -->
			<div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-6 border-t" style="border-color: var(--border);">
				<div class="stats-card stats-card-library">
					<h3>书库班总次数</h3>
					<p id="total-library-bottom">0</p>
				</div>
				<div class="stats-card stats-card-circulation">
					<h3>流通班总次数</h3>
					<p id="total-circulation-bottom">0</p>
				</div>
				<div class="stats-card stats-card-students">
					<h3>学生人数</h3>
					<p id="total-students-bottom">0</p>
				</div>
			</div>
		</div>

		<!-- 批量导入模态框 -->
		<div id="batch-import-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
			<div class="modal-content rounded-lg p-6 w-full max-w-md mx-4" style="background-color: var(--bg-card);">
				<div class="flex justify-between items-center mb-4">
					<h3 class="font-semibold text-lg" style="color: var(--text-primary);"><i
							class="fa-solid fa-file-import mr-2" style="color: var(--primary);"></i>批量导入学生</h3>
					<button id="close-modal-btn" style="color: var(--text-muted);" class="hover:opacity-70 transition-opacity">
						<i class="fa-solid fa-xmark text-lg"></i>
					</button>
				</div>
				<textarea id="batch-student-text" placeholder="请输入学生姓名，支持逗号、换行、空格分隔（例：张三,李四 王五&#10;赵六）" class="w-full h-32 px-3 py-2 rounded-lg mb-4 focus:outline-none resize-none" style="border: 1px solid var(--border); background-color: var(--bg-card); color: var(--text-primary);"></textarea>
				<div class="flex justify-end gap-3">
					<button id="cancel-import-btn" class="btn-custom btn-outline px-4 py-2 rounded-lg">取消</button>
					<button id="confirm-import-btn" class="btn-custom btn-primary px-4 py-2 rounded-lg">确认导入</button>
				</div>
			</div>
		</div>

		<!-- 操作日志模态框 -->
		<div id="history-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
			<div class="modal-content rounded-lg p-6 w-full max-w-2xl mx-4 max-h-[80vh]" style="background-color: var(--bg-card);">
				<div class="flex justify-between items-center mb-4">
					<h3 class="font-semibold text-lg" style="color: var(--text-primary);"><i
							class="fa-solid fa-history mr-2" style="color: var(--primary);"></i>操作日志</h3>
					<div class="flex items-center gap-3">
						<button id="undo-btn" class="btn-custom btn-warning px-3 py-1.5 rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
							<i class="fa-solid fa-undo mr-1"></i>撤销上一步
						</button>
						<button id="close-history-btn" style="color: var(--text-muted);" class="hover:opacity-70 transition-opacity">
							<i class="fa-solid fa-xmark text-lg"></i>
						</button>
					</div>
				</div>
				<div class="flex flex-wrap gap-3 mb-4">
					<select id="history-filter-type" class="px-3 py-1.5 rounded-lg border" style="border-color: var(--border); background-color: var(--bg-card); color: var(--text-primary);">
						<option value="">全部类型</option>
						<option value="add_student">添加学生</option>
						<option value="delete_student">删除学生</option>
						<option value="add_library">书库班次+1</option>
						<option value="add_circulation">流通班次+1</option>
						<option value="clear_library">清零书库</option>
						<option value="clear_circulation">清零流通</option>
						<option value="import_students">批量导入学生</option>
						<option value="reset_all">全部重置</option>
						<option value="undo">撤销操作</option>
					</select>
					<button id="clear-history-btn" class="btn-custom btn-danger btn-sm px-3 py-1.5 rounded-lg text-sm">
						<i class="fa-solid fa-trash-can mr-1"></i>清空日志
					</button>
				</div>
				<div id="history-list" class="overflow-y-auto max-h-[50vh]">
					<div class="text-center py-8 text-gray-500">
						<i class="fa-solid fa-history text-4xl mb-2 opacity-30"></i>
						<p>暂无操作日志</p>
					</div>
				</div>
			</div>
		</div>

		<!-- Toast提示 -->
		<div id="toast" class="fixed top-6 right-6 z-50">
			<i class="fa-solid fa-circle-info"></i>
			<span>操作提示</span>
		</div>

		<!-- JS Modules -->
		<script src="js/constants.js"></script>
		<script src="js/state.js"></script>
		<script src="js/data.js"></script>
		<script src="js/operations.js"></script>
		<script src="js/render.js"></script>
		<script src="js/events.js"></script>
		<script src="js/app.js"></script>
		<script src="js/debug.js"></script>
	</body>
</html>
